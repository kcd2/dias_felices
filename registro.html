<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#191919">
    <title>Días Felices - Registro</title>

    <link rel="preconnect" href="https://api.fontshare.com">
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=pilcrow-rounded@400,500,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="site.css">
</head>
<body>


    <div id="menu-container"></div>

    <main class="main-content auth-page field-red">
        <div class="auth-box">
            <h1 class="display">Registro</h1>
            <form id="registroForm">
                <label class="field-label" for="regNombre">Nombre completo *</label>
                <input type="text" id="regNombre" class="form-control-custom" autocomplete="name" required>
                <label class="field-label" for="regEmail">Correo electrónico *</label>
                <input type="email" id="regEmail" class="form-control-custom" autocomplete="email" required>

                <div class="password-group">
                    <label class="field-label" for="regPassword">Contraseña *</label>
                    <input type="password" id="regPassword" class="form-control-custom" autocomplete="new-password" aria-describedby="regPasswordReqs" required>
                    <span class="password-reqs" id="regPasswordReqs">Mínimo 6 caracteres y 1 mayúscula</span>
                    <div class="strength-bar-container">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                </div>

                <button type="submit" class="btn-auth">Crear cuenta</button>
            </form>
        </div>
    </main>

    <script>
        fetch('menu.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('menu-container').innerHTML = data;
                const linkRegistro = document.getElementById('link-registro');
                if (linkRegistro) linkRegistro.classList.add('active');
            });


        // Lógica visual del medidor
        const regPassword = document.getElementById('regPassword');
        const strengthBar = document.getElementById('strengthBar');

        regPassword.addEventListener('input', () => {
            const val = regPassword.value;
            let strength = 0;

            // Divide el 100% exacto en los dos requisitos
            if (val.length >= 6) strength += 50;
            if (/[A-ZÑÁÉÍÓÚÜ]/.test(val)) strength += 50;

            strengthBar.style.transform = `scaleX(${strength / 100})`;

            if (strength === 50) {
                strengthBar.style.background = '#ffe927'; // Amarillo si cumple a medias
            } else if (strength === 100) {
                strengthBar.style.background = '#2fbf9f'; // Verde si cumple todo
            } else {
                strengthBar.style.background = '#ffffff'; // Blanco si no cumple nada
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
