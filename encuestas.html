<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#191919">
    <title>Días Felices - Encuestas</title>

    <link rel="preconnect" href="https://api.fontshare.com">
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=pilcrow-rounded@400,500,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="site.css">
</head>
<body>

    <div id="menu-container"></div>

    <header class="page-head field-yellow">
        <div class="page-head__in">
            <h1 class="display">Encuestas semanales</h1>
        </div>
    </header>

    <main class="page-body">
        <div id="pollsContainer">
            <div class="poll-card">
                <h2 class="poll-title">¿Quién es el que peor maneja los videojuegos?</h2>
                <button class="btn-option" onclick="votar(1)">Opción A: El manco oficial</button>
                <button class="btn-option" onclick="votar(2)">Opción B: El que se cae solo</button>
                <button class="btn-option" onclick="votar(3)">Opción C: Yo mismo (honestidad)</button>
            </div>
            <div class="poll-card">
                <h2 class="poll-title">¿Cuál es el peor apodo denigrante de la temporada?</h2>
                <button class="btn-option" onclick="votar(4)">Opción A: El Becario</button>
                <button class="btn-option" onclick="votar(5)">Opción B: El Lentejas</button>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script>
        fetch('menu.html').then(r => r.text()).then(d => {
            document.getElementById('menu-container').innerHTML = d;
            const linkEncuestas = document.getElementById('link-encuestas');
            if(linkEncuestas) linkEncuestas.classList.add('active');
        });


        // Protección contra acceso directo por URL
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(async () => {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) {
                    alert("Acceso denegado. Debes iniciar sesión.");
                    window.location.href = 'login.html';
                    return;
                }
            }, 300);
        });

        async function votar(opcionId) {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                alert("Debes iniciar sesión para votar.");
                window.location.href = 'login.html';
                return;
            }
            alert("¡Voto registrado con éxito!");
        }
    </script>
</body>
</html>
