<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#140c0b">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23d71e1e'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%23f7c518'/%3E%3Ccircle cx='12' cy='13' r='1.6' fill='%23140c0b'/%3E%3Ccircle cx='20' cy='13' r='1.6' fill='%23140c0b'/%3E%3Cpath d='M10 18c1.5 5 10.5 5 12 0z' fill='%23140c0b'/%3E%3C/svg%3E">
    <title>Días Felices - Encuestas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <script>document.documentElement.classList.add('js');addEventListener('pagereveal',e=>{const t=e.viewTransition;if(t)[t.ready,t.finished].forEach(p=>p.catch(()=>{}))})</script>
    <link rel="stylesheet" href="site.css">
</head>
<body>

    <div id="menu-container"></div>

    <header class="page-head field-yellow">
        <div class="page-head__in">
            <h1 class="display">Encuestas semanales</h1>
        </div>
    </header>

    <main class="page-body">
        <div id="pollsContainer">
            <div class="poll-card">
                <h2 class="poll-title">¿Quién es el que peor maneja los videojuegos?</h2>
                <button class="btn-option" onclick="votar(1)">Opción A: El manco oficial</button>
                <button class="btn-option" onclick="votar(2)">Opción B: El que se cae solo</button>
                <button class="btn-option" onclick="votar(3)">Opción C: Yo mismo (honestidad)</button>
            </div>
            <div class="poll-card">
                <h2 class="poll-title">¿Cuál es el peor apodo denigrante de la temporada?</h2>
                <button class="btn-option" onclick="votar(4)">Opción A: El Becario</button>
                <button class="btn-option" onclick="votar(5)">Opción B: El Lentejas</button>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script>
        fetch('menu.html').then(r => r.text()).then(d => {
            document.getElementById('menu-container').innerHTML = d;
            const linkEncuestas = document.getElementById('link-encuestas');
            if(linkEncuestas) linkEncuestas.classList.add('active');
        });


        // Protección contra acceso directo por URL
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(async () => {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) {
                    alert("Acceso denegado. Debes iniciar sesión.");
                    window.location.href = 'login.html';
                    return;
                }
            }, 300);
        });

        async function votar(opcionId) {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                alert("Debes iniciar sesión para votar.");
                window.location.href = 'login.html';
                return;
            }
            alert("¡Voto registrado con éxito!");
        }
    </script>
</body>
</html>
