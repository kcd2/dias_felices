<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#140c0b">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23d71e1e'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%23f7c518'/%3E%3Ccircle cx='12' cy='13' r='1.6' fill='%23140c0b'/%3E%3Ccircle cx='20' cy='13' r='1.6' fill='%23140c0b'/%3E%3Cpath d='M10 18c1.5 5 10.5 5 12 0z' fill='%23140c0b'/%3E%3C/svg%3E">
    <title>Días Felices - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <script>document.documentElement.classList.add('js');addEventListener('pagereveal',e=>{const t=e.viewTransition;if(t)[t.ready,t.finished].forEach(p=>p.catch(()=>{}))})</script>
    <link rel="stylesheet" href="site.css">
</head>
<body>


    <!-- Menú inyectado -->
    <div id="menu-container"></div>

    <main class="main-content auth-page field-blue">
        <div class="auth-box">
            <h1 class="display">Login</h1>
            <form id="loginForm">
                <label class="field-label" for="loginEmail">Correo electrónico</label>
                <input type="email" id="loginEmail" class="form-control-custom" autocomplete="email" required>
                <label class="field-label" for="loginPassword">Contraseña</label>
                <input type="password" id="loginPassword" class="form-control-custom" autocomplete="current-password" required>
                <button type="submit" class="btn-auth">Ingresar</button>
            </form>
        </div>
    </main>

    <script>
        fetch('menu.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('menu-container').innerHTML = data;
                // Esto asegura que "Login" quede resaltado en el menú
                document.getElementById('link-login')?.classList.add('active');
            });

    </script>

    <!-- Cargar librería oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Cargar tu archivo lógico de conexión -->
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
