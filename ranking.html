<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#140c0b">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23d71e1e'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%23f7c518'/%3E%3Ccircle cx='12' cy='13' r='1.6' fill='%23140c0b'/%3E%3Ccircle cx='20' cy='13' r='1.6' fill='%23140c0b'/%3E%3Cpath d='M10 18c1.5 5 10.5 5 12 0z' fill='%23140c0b'/%3E%3C/svg%3E">
    <title>Días Felices - Ranking MySpace</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <script>document.documentElement.classList.add('js');addEventListener('pagereveal',e=>{const t=e.viewTransition;if(t)[t.ready,t.finished].forEach(p=>p.catch(()=>{}))})</script>
    <link rel="stylesheet" href="site.css">
</head>
<body>

    <div id="menu-container"></div>

    <header class="page-head field-red">
        <div class="page-head__in">
            <h1 class="display">Top amigos MySpace</h1>
        </div>
    </header>

    <main class="page-body">
        <div class="ranking-box" id="rankingList">
            <p class="text-center text-muted">Cargando ranking...</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script>
        fetch('menu.html').then(r => r.text()).then(d => {
            document.getElementById('menu-container').innerHTML = d;
            const linkRanking = document.getElementById('link-ranking');
            if(linkRanking) linkRanking.classList.add('active');
        });


        // Protección contra acceso directo por URL
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(async () => {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) {
                    alert("Acceso denegado. Debes iniciar sesión.");
                    window.location.href = 'login.html';
                    return;
                }

                const { data: amigos, error } = await supabaseClient
                    .from('amigos')
                    .select('*')
                    .order('puntos_myspace', { ascending: false });

                const container = document.getElementById('rankingList');
                if (error) return container.innerHTML = `<p class="text-danger">Error: ${error.message}</p>`;
                if (!amigos.length) return container.innerHTML = `<p class="text-muted text-center">No hay amigos registrados todavía.</p>`;

                container.innerHTML = amigos.map((user, index) => {
                    const foto = user.foto_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.nombre_real)}&background=303030&color=ffffff`;
                    return `
                        <div class="ranking-item">
                            <div class="user-info">
                                <span class="user-rank">#${index + 1}</span>
                                <img src="${foto}" alt="" class="user-avatar">
                                <div>
                                    <h2 class="user-name">${user.nombre_real || 'Anónimo'}</h2>
                                    <p class="user-apodo">${user.apodo_denigrante ? '@' + user.apodo_denigrante : 'Sin apodo asignado'}</p>
                                </div>
                            </div>
                            <div class="user-points">
                                ${user.puntos_myspace || 0} pts
                            </div>
                        </div>
                    `;
                }).join('');
            }, 500);
        });
    </script>
</body>
</html>
