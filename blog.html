<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#140c0b">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23d71e1e'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%23f7c518'/%3E%3Ccircle cx='12' cy='13' r='1.6' fill='%23140c0b'/%3E%3Ccircle cx='20' cy='13' r='1.6' fill='%23140c0b'/%3E%3Cpath d='M10 18c1.5 5 10.5 5 12 0z' fill='%23140c0b'/%3E%3C/svg%3E">
    <title>Días Felices - Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <script>document.documentElement.classList.add('js');addEventListener('pagereveal',e=>{const t=e.viewTransition;if(t)[t.ready,t.finished].forEach(p=>p.catch(()=>{}))})</script>
    <link rel="stylesheet" href="site.css">
</head>
<body>
    <div id="menu-container"></div>

    <header class="page-head field-blue">
        <div class="page-head__in">
            <h1 class="display">El muro</h1>
            <p class="page-lede">Historias de la muchachada</p>
        </div>
    </header>

    <main class="page-body">
        <form id="formBlog" class="post-form" style="display: none;">
            <textarea id="contenidoPost" class="post-input" rows="3" placeholder="¿Qué tienes en mente hoy?" aria-label="¿Qué tienes en mente hoy?" required></textarea>
            <button type="submit" class="btn-post">Publicar</button>
        </form>

        <div id="feedBlog" class="feed-status">
            <p>Cargando publicaciones...</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script>
        fetch('menu.html').then(r => r.text()).then(d => {
            document.getElementById('menu-container').innerHTML = d;
            const linkBlog = document.getElementById('link-blog');
            if(linkBlog) linkBlog.classList.add('active');
        });

        let currentUserAuthId = null;

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(async () => {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    currentUserAuthId = session.user.id;
                    document.getElementById('formBlog').style.display = 'block';
                }
                cargarPosts();
            }, 500);
        });

        async function cargarPosts() {
            // Requiere que tengas una tabla 'blog' con columnas: id, auth_id, contenido, created_at
            const { data: posts, error } = await supabaseClient
                .from('blog')
                .select(`
                    id, contenido, created_at,
                    amigos ( nombre_real, foto_url )
                `)
                .order('created_at', { ascending: false });

            const feed = document.getElementById('feedBlog');
            if (error) {
                feed.textContent = `No se pudieron cargar las publicaciones: ${error.message}`;
                feed.setAttribute('role', 'status');
                return;
            }
            if (!posts.length) {
                feed.textContent = 'No hay publicaciones aún. ¡Sé el primero!';
                return;
            }

            const fragment = document.createDocumentFragment();
            posts.forEach(post => {
                const autor = post.amigos?.nombre_real || 'Usuario desconocido';
                const foto = post.amigos?.foto_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(autor)}&background=dce8dc&color=18312d`;
                const card = document.createElement('article');
                card.className = 'post-card';

                const avatar = document.createElement('img');
                avatar.src = foto;
                avatar.alt = '';
                avatar.className = 'post-avatar';
                avatar.loading = 'lazy';

                const details = document.createElement('div');
                const author = document.createElement('h2');
                author.className = 'post-author';
                author.textContent = autor;
                const date = document.createElement('time');
                date.className = 'post-date';
                date.dateTime = post.created_at;
                date.textContent = new Date(post.created_at).toLocaleString('es-ES');
                const content = document.createElement('p');
                content.className = 'post-content';
                content.textContent = post.contenido || '';

                details.append(author, date, content);
                card.append(avatar, details);
                fragment.append(card);
            });
            feed.replaceChildren(fragment);
        }

        document.getElementById('formBlog').addEventListener('submit', async (e) => {
            e.preventDefault();
            const contenido = document.getElementById('contenidoPost').value;

            const { error } = await supabaseClient.from('blog').insert([{
                auth_id: currentUserAuthId,
                contenido: contenido
            }]);

            if (error) {
                alert("Error al publicar: " + error.message);
            } else {
                document.getElementById('contenidoPost').value = '';
                cargarPosts();
            }
        });
    </script>
</body>
</html>
