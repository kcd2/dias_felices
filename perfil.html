<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#140c0b">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23d71e1e'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%23f7c518'/%3E%3Ccircle cx='12' cy='13' r='1.6' fill='%23140c0b'/%3E%3Ccircle cx='20' cy='13' r='1.6' fill='%23140c0b'/%3E%3Cpath d='M10 18c1.5 5 10.5 5 12 0z' fill='%23140c0b'/%3E%3C/svg%3E">
    <title>Días Felices - Mi Perfil</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <script>document.documentElement.classList.add('js');addEventListener('pagereveal',e=>{const t=e.viewTransition;if(t)[t.ready,t.finished].forEach(p=>p.catch(()=>{}))})</script>
    <link rel="stylesheet" href="site.css">
</head>
<body>


    <div id="menu-container"></div>

    <header class="page-head field-teal">
        <div class="page-head__in profile-head">
            <div class="profile-img-container">
                <img id="displayFoto" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="Foto de perfil">
            </div>
            <div>
                <h1 class="display" id="displayNombre">Cargando...</h1>
                <div class="profile-role" id="displayRol">---</div>
            </div>
        </div>
    </header>

    <main class="page-body">
        <div class="stats-container">
            <div class="stat-item">
                <h2 id="displayApodo">---</h2>
                <p>Apodo</p>
            </div>
            <div class="stat-item">
                <h2 id="displayPuntos">0</h2>
                <p>Puntos MySpace</p>
            </div>
        </div>

        <div class="profile-box">
            <form id="perfilForm" style="display: none;">
                <h2 class="form-title">Editar perfil</h2>

                <label class="field-label" for="inputFoto">URL de tu foto de perfil</label>
                <input type="text" id="inputFoto" class="form-control-custom" placeholder="Ej: https://imgur.com/...">

                <label class="field-label" for="inputBio">Biografía troll</label>
                <textarea id="inputBio" class="form-control-custom" rows="2" placeholder="Escribe tu biografía troll aquí..."></textarea>

                <button type="submit" class="btn-auth">Guardar cambios</button>
            </form>
        </div>
    </main>

    <script>
        fetch('menu.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('menu-container').innerHTML = data;
                const linkPerfil = document.getElementById('link-perfil');
                if (linkPerfil) linkPerfil.classList.add('active');
            });

    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            setTimeout(async () => {
                const { data: { session } } = await supabaseClient.auth.getSession();

                if (!session) {
                    alert("Debes iniciar sesión para ver tu perfil.");
                    window.location.href = 'login.html';
                    return;
                }

                const userId = session.user.id;
                const nombreSesion = session.user.user_metadata.full_name || "Usuario";

                const { data: perfilData, error } = await supabaseClient
                    .from('amigos')
                    .select('*')
                    .eq('auth_id', userId)
                    .single();

                const nombreFinal = perfilData?.nombre_real || nombreSesion;
                document.getElementById('displayNombre').textContent = nombreFinal;
                document.getElementById('displayRol').textContent = perfilData?.rol || "Usuario";
                document.getElementById('displayApodo').textContent = perfilData?.apodo_denigrante || "---";
                document.getElementById('displayPuntos').textContent = perfilData?.puntos_myspace || "0";

                const fotoDefault = `https://ui-avatars.com/api/?name=${encodeURIComponent(nombreFinal)}&background=303030&color=ffffff&size=150`;

                if (perfilData && perfilData.foto_url) {
                    document.getElementById('displayFoto').src = perfilData.foto_url;
                    document.getElementById('inputFoto').value = perfilData.foto_url;
                } else {
                    document.getElementById('displayFoto').src = fotoDefault;
                }

                if (perfilData && perfilData.biografia_troll) {
                    document.getElementById('inputBio').value = perfilData.biografia_troll;
                }

                document.getElementById('perfilForm').style.display = "block";

                document.getElementById('perfilForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const nuevaFoto = document.getElementById('inputFoto').value.trim();
                    const nuevaBio = document.getElementById('inputBio').value.trim();

                    const { error: updateError } = await supabaseClient
                        .from('amigos')
                        .upsert({
                            auth_id: userId,
                            nombre_real: nombreFinal,
                            foto_url: nuevaFoto,
                            biografia_troll: nuevaBio,
                            rol: perfilData?.rol || 'usuario'
                        }, { onConflict: 'auth_id' });

                    if (updateError) {
                        alert("Error al actualizar el perfil.");
                        console.error(updateError);
                    } else {
                        alert("¡Perfil actualizado con éxito!");
                        if (nuevaFoto) {
                            document.getElementById('displayFoto').src = nuevaFoto;
                        } else {
                            document.getElementById('displayFoto').src = fotoDefault;
                        }
                    }
                });

            }, 500);
        });
    </script>
</body>
</html>
