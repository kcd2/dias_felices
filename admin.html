<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#140c0b">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23d71e1e'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%23f7c518'/%3E%3Ccircle cx='12' cy='13' r='1.6' fill='%23140c0b'/%3E%3Ccircle cx='20' cy='13' r='1.6' fill='%23140c0b'/%3E%3Cpath d='M10 18c1.5 5 10.5 5 12 0z' fill='%23140c0b'/%3E%3C/svg%3E">
    <title>Días Felices - Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <script>document.documentElement.classList.add('js');addEventListener('pagereveal',e=>{const t=e.viewTransition;if(t)[t.ready,t.finished].forEach(p=>p.catch(()=>{}))})</script>
    <link rel="stylesheet" href="site.css">
</head>
<body>

    <div id="menu-container"></div>

    <header class="page-head field-charcoal">
        <div class="page-head__in wide">
            <h1 class="display">Panel de control</h1>
        </div>
    </header>

    <main class="page-body wide">
        <div class="admin-panel">
            <table class="table-custom">
                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>Nombre</th>
                        <th>Apodo Denigrante</th>
                        <th>Puntos MySpace</th>
                        <th>Rol</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaUsuarios">
                    <tr><td colspan="6" class="text-center">Cargando usuarios...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script>
        fetch('menu.html').then(r => r.text()).then(d => {
            document.getElementById('menu-container').innerHTML = d;
            const linkAdmin = document.getElementById('link-admin');
            if(linkAdmin) linkAdmin.classList.add('active');
        });


        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(async () => {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) return window.location.href = 'login.html';

                const { data: currentUser } = await supabaseClient.from('amigos').select('rol').eq('auth_id', session.user.id).single();
                if (!currentUser || (currentUser.rol !== 'propietario' && currentUser.rol !== 'administrador')) {
                    alert("Acceso denegado. No tienes permisos de administrador.");
                    window.location.href = 'index.html';
                    return;
                }

                cargarUsuarios();
            }, 500);
        });

        async function cargarUsuarios() {
            const { data: usuarios, error } = await supabaseClient.from('amigos').select('*').order('puntos_myspace', { ascending: false });
            if (error) return console.error(error);

            const tbody = document.getElementById('tablaUsuarios');
            tbody.innerHTML = '';

            usuarios.forEach(user => {
                const foto = user.foto_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.nombre_real)}&background=303030&color=ffffff`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><img src="${foto}" alt="" width="40" height="40" class="table-avatar"></td>
                    <td>${user.nombre_real || 'Sin nombre'}</td>
                    <td><input type="text" class="input-admin" id="apodo_${user.id}" aria-label="Apodo" value="${user.apodo_denigrante || ''}"></td>
                    <td><input type="number" class="input-admin" id="puntos_${user.id}" aria-label="Puntos MySpace" value="${user.puntos_myspace || 0}"></td>
                    <td>
                        <select class="input-admin" id="rol_${user.id}" aria-label="Rol">
                            <option value="usuario" ${user.rol === 'usuario' ? 'selected' : ''}>Usuario</option>
                            <option value="administrador" ${user.rol === 'administrador' ? 'selected' : ''}>Admin</option>
                            <option value="propietario" ${user.rol === 'propietario' ? 'selected' : ''}>Propietario</option>
                        </select>
                    </td>
                    <td><button class="btn-save" onclick="guardarUsuario(${user.id})">Guardar</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function guardarUsuario(id) {
            const apodo = document.getElementById(`apodo_${id}`).value;
            const puntos = document.getElementById(`puntos_${id}`).value;
            const rol = document.getElementById(`rol_${id}`).value;

            const { error } = await supabaseClient.from('amigos').update({
                apodo_denigrante: apodo,
                puntos_myspace: puntos,
                rol: rol
            }).eq('id', id);

            if (error) alert("Error al guardar: " + error.message);
            else alert("Usuario actualizado.");
        }
    </script>
</body>
</html>
