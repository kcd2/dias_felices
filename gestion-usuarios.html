<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#191919">
    <title>Días Felices - Gestión de Usuarios</title>

    <link rel="preconnect" href="https://api.fontshare.com">
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=pilcrow-rounded@400,500,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="site.css">
</head>
<body>

    <div id="menu-container"></div>

    <header class="page-head field-charcoal">
        <div class="page-head__in wide">
            <h1 class="display">Gestión de usuarios</h1>
        </div>
    </header>

    <main class="page-body wide">
        <div class="admin-panel">
            <table class="table-custom">
                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>Nombre</th>
                        <th>Apodo Denigrante</th>
                        <th>Puntos MySpace</th>
                        <th>Rol</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaGestionUsuarios">
                    <tr><td colspan="6" class="text-center text-muted">Verificando credenciales de administrador...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script>
        fetch('menu.html').then(r => r.text()).then(d => {
            document.getElementById('menu-container').innerHTML = d;
        });


        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(async () => {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) {
                    alert("Debes iniciar sesión.");
                    return window.location.href = 'login.html';
                }

                const { data: currentUser } = await supabaseClient
                    .from('amigos')
                    .select('rol')
                    .eq('auth_id', session.user.id)
                    .single();

                if (!currentUser || (currentUser.rol !== 'propietario' && currentUser.rol !== 'administrador')) {
                    alert("Acceso denegado. Esta sección es exclusiva para administradores.");
                    return window.location.href = 'index.html';
                }

                cargarUsuariosGestion();
            }, 500);
        });

        async function cargarUsuariosGestion() {
            const { data: usuarios, error } = await supabaseClient
                .from('amigos')
                .select('*')
                .order('puntos_myspace', { ascending: false });

            const tbody = document.getElementById('tablaGestionUsuarios');
            if (error) return tbody.innerHTML = `<tr><td colspan="6" class="text-danger text-center">Error: ${error.message}</td></tr>`;
            if (!usuarios.length) return tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">No hay usuarios registrados.</td></tr>`;

            tbody.innerHTML = '';

            usuarios.forEach(user => {
                const foto = user.foto_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.nombre_real || 'User')}&background=303030&color=ffffff`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><img src="${foto}" alt="" width="40" height="40" class="table-avatar"></td>
                    <td>${user.nombre_real || 'Sin nombre'}</td>
                    <td><input type="text" class="input-admin" id="apodo_${user.id}" aria-label="Apodo" value="${user.apodo_denigrante || ''}"></td>
                    <td><input type="number" class="input-admin" id="puntos_${user.id}" aria-label="Puntos MySpace" value="${user.puntos_myspace || 0}"></td>
                    <td>
                        <select class="input-admin" id="rol_${user.id}" aria-label="Rol">
                            <option value="usuario" ${user.rol === 'usuario' ? 'selected' : ''}>Usuario</option>
                            <option value="administrador" ${user.rol === 'administrador' ? 'selected' : ''}>Administrador</option>
                            <option value="propietario" ${user.rol === 'propietario' ? 'selected' : ''}>Propietario</option>
                        </select>
                    </td>
                    <td><button class="btn-blue-custom" onclick="guardarCambiosUsuario(${user.id})">Guardar</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function guardarCambiosUsuario(id) {
            const apodo = document.getElementById(`apodo_${id}`).value;
            const puntos = document.getElementById(`puntos_${id}`).value;
            const rol = document.getElementById(`rol_${id}`).value;

            const { error } = await supabaseClient.from('amigos').update({
                apodo_denigrante: apodo,
                puntos_myspace: parseInt(puntos) || 0,
                rol: rol
            }).eq('id', id);

            if (error) {
                alert("Error al actualizar: " + error.message);
            } else {
                alert("¡Usuario actualizado correctamente!");
            }
        }
    </script>
</body>
</html>
